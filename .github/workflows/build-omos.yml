name: Build OneMind OS → GHCR

# Builds ghcr.io/onemindos/cloudtak-api:latest from this fork directly.
# The onemind-ai plugin lives in api/web/plugins/onemind-ai/ and is
# picked up automatically by bin/plugin.ts during Docker build.

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "tasks/**"
      - ".github/workflows/build-omos.yml"
  workflow_dispatch:

jobs:
  build-push:
    name: Build ghcr.io/onemindos/cloudtak-api
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout OMOS
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from package.json
        id: version
        run: |
          VER=$(node -p "require('./api/package.json').version")
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "Building version: ${VER}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: api
          file: api/Dockerfile
          push: true
          tags: |
            ghcr.io/onemindos/omos:latest
            ghcr.io/onemindos/omos:v${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
